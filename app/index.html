  --bg1:#ebe6ff; --bg2:#dce9ff;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:15px/1.5 var(--font-b);color:var(--ink);background:linear-gradient(135deg,#e2dcff,#d6e6ff);}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.1}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}

.page{padding:max(16px,env(safe-area-inset-top,0px)) 18px calc(110px + env(safe-area-inset-bottom,0px));min-height:100dvh;animation:in .35s cubic-bezier(.2,.8,.2,1)}

.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:0 6px 18px -10px rgba(40,50,140,.4)}
.link{color:var(--blue);font-weight:800}
.field{display:flex;align-items:center;gap:10px;height:54px;border-radius:18px;background:var(--soft);padding:0 8px;border:2px solid transparent}
.field:focus-within{border-color:var(--blue);background:#fff}
.field i{flex:none;width:40px;height:40px;border-radius:14px;background:#dfe7ff;display:grid;place-items:center;color:var(--blue)}
.field input,.field select{flex:1;min-width:0;border:0;background:transparent;outline:none;font-weight:700;font-size:15.5px;height:100%}
.field input::placeholder{color:#8a93b4;font-weight:600}
.card{background:var(--card);border-radius:24px;box-shadow:0 14px 30px -18px rgba(40,50,140,.35)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-weight:800;font-size:13px;padding:7px 12px;white-space:nowrap}
.prog{height:8px;border-radius:9px;background:#e6ebfb;overflow:hidden}
.prog b{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blue),#5fd4ff);transition:width .6s}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-t h2{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.err{color:#d93652;font-weight:700;font-size:13.5px;min-height:20px}
.ok{color:#0f9e6e;font-weight:700;font-size:13.5px}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(416px,calc(100% - 24px));height:70px;border-radius:26px;background:#fff;box-shadow:0 10px 30px -10px rgba(40,50,140,.35);display:flex;justify-content:space-around;align-items:center;z-index:20}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:#9aa3c2;text-decoration:none;padding:6px 4px;min-width:58px}
.nav a.on{color:var(--blue)}
.nav svg{width:22px;height:22px}

.cloud{position:absolute;background:#fff;border-radius:40px;opacity:.9}
.login-top{text-align:center;margin-top:18px}
.login-top h1{font-size:30px;font-weight:900;color:#2f3a8a}
.toggle{position:relative;z-index:3;display:flex;justify-content:center;gap:10px;margin-top:16px}
.toggle button{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:#fff;color:var(--muted);font-weight:800;font-size:13.5px;box-shadow:0 6px 16px -10px rgba(40,50,140,.4);transition:background .2s,color .2s}
.toggle button[aria-pressed="true"]{background:var(--blue);color:#fff}
.toggle .face{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#dfe7ff}
.peek{pointer-events:none;position:relative;height:190px;display:flex;justify-content:center;align-items:flex-end;margin-top:6px;z-index:1}
.peek img,.peek svg{height:205px;width:auto;margin-bottom:-24px}
.login-card{position:relative;z-index:2;padding:22px 18px;border-radius:30px;display:flex;flex-direction:column;gap:12px}
.social{display:flex;justify-content:center;gap:16px}
.social button{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font:900 20px var(--font-d)}

.peek svg{display:block}

.lbl{font-size:11.5px;font-weight:800;color:var(--dim);letter-spacing:1.2px;margin:16px 2px 10px}
.swatches{display:flex;flex-wrap:wrap;gap:14px;padding:0 4px}
.sw{width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(0,0,0,.15)}

.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.ic svg{width:22px;height:22px}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px}
.chk{flex:none;width:28px;height:28px;border-radius:9px;border:2.5px solid #c9d2ee;display:grid;place-items:center;color:#fff;transition:background .2s,border-color .2s}

.task.done .t{text-decoration:line-through;color:#9aa3c2}

.qr svg{width:100%;height:100%}
.switch{position:relative;width:48px;height:28px;border-radius:20px;background:#cdd5ec;flex:none;transition:background .2s}
.switch[aria-checked="true"]{background:var(--blue)}

.spinner{width:34px;height:34px;border-radius:50%;border:4px solid #dfe7ff;border-top-color:var(--blue);animation:spin .8s linear infinite;margin:40vh auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</head>

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#2f6fff","#8b5cf6","#10b981","#f59e0b","#ff6b8b","#5fd4ff"];
  const P = Array.from({length: 140}, () => ({x: c.width / 2, y: c.height * .35, vx: (Math.random() - .5) * 14, vy: Math.random() * -14 - 4, s: Math.random() * 7 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3, col: cols[Math.random() * cols.length | 0]}));
  let f = 0; (function tick() { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.col; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if (++f < 140) requestAnimationFrame(tick); else c.remove(); })();
}

async function loadAll() {
  const uid = S.session.user.id;
  const [p, e, t, c, b, g] = await Promise.all([
    sb.from("hs_profiles").select("*").eq("id", uid).maybeSingle(),
    sb.from("hs_enrollments").select("*").order("updated_at", {ascending: false}),
    sb.from("hs_tasks").select("*").order("data").order("concluida"),
    sb.from("hs_certificates").select("*").order("emitido_em", {ascending: false}),
    sb.from("hs_badges").select("*"),
    sb.from("hs_guardians").select("*").order("created_at")
  ]);
  S.profile = p.data; S.enroll = e.data || []; S.tasks = t.data || []; S.certs = c.data || []; S.badges = b.data || []; S.guardians = g.data || [];
}
async function ensureProfile() {
  const uid = S.session.user.id;
  let { data } = await sb.from("hs_profiles").select("*").eq("id", uid).maybeSingle();
  if (!data) {
    const md = S.session.user.user_metadata || {};
    const nome = md.nome || md.full_name || md.name || (S.session.user.email || "Aluno").split("@")[0];
    const r = await sb.rpc("hs_bootstrap", {p_nome: nome, p_idade: parseInt(md.idade) || 10, p_genero: md.genero || S.loginGender});
    if (r.error) throw r.error;
    data = r.data;
  }
  S.profile = data;
  await loadAll();
}

function go(r) { if (location.hash !== "#" + r) location.hash = r; else route(); }
async function route() {
  const h = location.hash.slice(1) || "inicio";
  const [r, arg] = h.split("/");
  if (r === "familia") return renderFamilia(arg);
  if (r === "nova-senha" || S.recovery) return renderNovaSenha();
  if (!S.session) { nav.hidden = true; return r === "cadastro" ? renderCadastro() : r === "recuperar" ? renderRecuperar() : renderLogin(); }
  if (!S.profile) { app.innerHTML = '<div class="spinner"></div>'; try { await ensureProfile(); } catch (e) { console.error(e); app.innerHTML = `<div class="page"><h2>Não conseguimos abrir sua conta</h2><p class="muted">${esc(e.message)}</p><button class="btn" id="retry">Tentar de novo</button></div>`; $("#retry").onclick = () => location.reload(); return; } }

function downloadCert(c) {

  const notify = S.guardians.length ? S.guardians.every(g => g.notificar) : true;
  app.innerHTML = `<div class="page">
    <div style="text-align:center;padding-top:6px">${avatarCircle(p.avatar, 100)}
      <h1 style="font-size:20px;margin-top:12px">${esc(p.nome)}</h1><div class="small muted" style="font-weight:700;margin-top:2px">${esc(p.idade || "")} anos · Unidade ${esc(p.unidade)}</div>
      <a href="#avatar" class="pill" style="background:#e8efff;color:var(--blue);margin-top:10px;text-decoration:none">Editar avatar</a></div>
    <div class="fam" style="margin-top:18px">
      <div class="row" style="gap:10px"><span style="width:26px;height:26px;color:#9fd8ff">${ic("family")}</span><h2 style="font-size:16px">Compartilhar com os pais</h2></div>
      <p class="small" style="opacity:.88;margin:8px 0 0;line-height:1.45">Seus responsáveis acompanham aulas, tarefas e certificados. Mostre o QR code ou envie o código.</p>
      <div class="row" style="margin-top:12px"><div style="flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px"><div class="small" style="opacity:.8;font-weight:800;letter-spacing:1px">CÓDIGO FAMÍLIA</div><div style="font:800 21px var(--font-d);letter-spacing:3px;margin-top:2px">${esc(p.codigo_familia)}</div></div><div class="qr" aria-label="QR code da área dos pais">${qrSVG(famURL)}</div></div>
      <button class="btn ghost" id="sharefam" style="height:46px;margin-top:12px;font-size:14.5px"><span style="width:18px;height:18px">${ic("share")}</span>Enviar link para os pais</button>
    </div>
    <div class="card" style="margin-top:14px;padding:4px 14px">
      ${S.guardians.map(g => `<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><span style="width:38px;height:38px;border-radius:50%;background:#ffe9ef;display:grid;place-items:center;font-weight:900;color:#e0446b">${esc(g.nome[0] || "?").toUpperCase()}</span><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px">${esc(g.nome)}${g.parentesco ? ` (${esc(g.parentesco)})` : ""}</div><div class="small" style="font-weight:800;color:${g.status === "conectado" ? "var(--green)" : "var(--orange)"}">${g.status === "conectado" ? "Conectado" : "Convite enviado"}</div></div><button class="small muted" data-rm="${g.id}" style="font-weight:700">Remover</button></div>`).join("")}
      <button class="row" id="invite" style="padding:12px 0;width:100%;border-bottom:1px solid var(--line);text-align:left"><span style="width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--blue)"><span style="width:20px;height:20px">${ic("plus", 3)}</span></span><span style="font-weight:800;font-size:14px">Convidar responsável</span></button>
      <div class="row" style="padding:12px 0"><div style="flex:1;font-weight:700;font-size:14px">Avisar os pais quando concluir tarefas</div><button class="switch" role="switch" id="notif" aria-checked="${notify}" aria-label="Avisar os pais"></button></div>
    </div>
    <div id="adminbox"></div>
    <button class="btn ghost" id="out" style="margin-top:16px;color:#d93652"><span style="width:20px;height:20px">${ic("out")}</span>Sair da conta</button>
  </div>`;
  $("#sharefam").onclick = async () => {
    const text = `Acompanhe ${p.nome.split(" ")[0]} na Hall School. Código família: ${p.codigo_familia}`;
    try { if (navigator.share) { await navigator.share({ title: "Hall School · Família", text, url: famURL }); return; } } catch (_) { return; }
    try { await navigator.clipboard.writeText(`${text}\n${famURL}`); toast("Link copiado"); } catch (_) { toast(famURL); }
  };
  $("#notif").onclick = async e => {
    const v = e.currentTarget.getAttribute("aria-checked") !== "true"; e.currentTarget.setAttribute("aria-checked", String(v));
    if (S.guardians.length) { await sb.from("hs_guardians").update({ notificar: v }).eq("student_id", p.id); S.guardians.forEach(g => g.notificar = v); }
    toast(v ? "Avisos ligados" : "Avisos desligados");
  };
  $$("[data-rm]").forEach(b => b.onclick = async () => { const { error } = await sb.from("hs_guardians").delete().eq("id", b.dataset.rm); if (!error) { S.guardians = S.guardians.filter(g => g.id !== b.dataset.rm); renderConta(); } });
  $("#invite").onclick = () => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<form class="sheet" role="dialog" aria-modal="true" aria-label="Convidar responsável"><h2 style="font-size:18px">Convidar responsável</h2>
      <label class="field"><i>${ic("user")}</i><input id="gn" maxlength="80" placeholder="Nome" required></label>
      <label class="field"><i>${ic("family")}</i><select id="gp"><option>Mãe</option><option>Pai</option><option>Avó</option><option>Avô</option><option>Tia</option><option>Tio</option><option>Outro</option></select></label>
      <label class="field"><i>${ic("mail")}</i><input id="ge" type="email" maxlength="160" placeholder="E-mail (opcional)"></label>
      <p class="small muted" style="margin:0">Depois, envie o link ou o código família para essa pessoa.</p>
      <button class="btn">Adicionar</button><button type="button" class="btn ghost" id="cl">Cancelar</button></form>`;
    document.body.appendChild(m); $("#gn", m).focus();
    $("#cl", m).onclick = () => m.remove(); m.onclick = ev => { if (ev.target === m) m.remove(); };
    $("form", m).onsubmit = async ev => {
      ev.preventDefault(); const nome = $("#gn", m).value.trim(); if (!nome) return;
      const { data, error } = await sb.from("hs_guardians").insert({ student_id: p.id, nome, parentesco: $("#gp", m).value, email: $("#ge", m).value.trim() || null }).select().single();
      if (error) { toast("Não foi possível adicionar."); return; }
      S.guardians.push(data); m.remove(); toast("Responsável adicionado"); renderConta();
    };
  };
  $("#out").onclick = async () => { await sb.auth.signOut(); S.profile = null; S.isAdmin = undefined; location.hash = "login"; };
  checkAdmin().then(ok => { if (ok && $("#adminbox")) $("#adminbox").innerHTML = `<a href="#escola" class="card row" style="margin-top:14px;padding:14px;text-decoration:none;color:inherit;background:linear-gradient(135deg,#fff7e0,#ffe7b0)"><span style="width:26px;height:26px;color:#a2700a">${ic("award")}</span><div style="flex:1"><div style="font-weight:800">Painel da escola</div><div class="small" style="color:#7a5a12">Alunos, progresso, certificados e leads</div></div><span style="width:20px;height:20px;transform:rotate(180deg);color:#a2700a">${ic("back")}</span></a>`; });
}
async function checkAdmin() {
  if (S.isAdmin !== undefined) return S.isAdmin;
  const { data } = await sb.rpc("is_hallschool_admin"); S.isAdmin = !!data; return S.isAdmin;
}

/* ---------- Painel da escola (admin) ---------- */
async function renderEscola() {
  if (!(await checkAdmin())) return go("conta");
  app.innerHTML = '<div class="spinner"></div>';
  const [p, e, c] = await Promise.all([
    sb.from("hs_profiles").select("*").order("created_at", { ascending: false }),
    sb.from("hs_enrollments").select("user_id,curso,progresso"),
    sb.from("hs_certificates").select("user_id,titulo")
  ]);
  const alunos = p.data || [], enr = e.data || [], certs = c.data || [];
  let q = "";
  const draw = () => {
    const list = alunos.filter(a => !q || a.nome.toLowerCase().includes(q) || a.codigo_familia.toLowerCase().includes(q));
    app.innerHTML = `<div class="page">
      <div class="between"><a href="#conta" class="row link small" style="gap:2px;text-decoration:none"><span style="width:18px;height:18px">${ic("back", 2.6)}</span>Conta</a><a href="../admin/" class="pill" style="background:#141b3a;color:#fff;text-decoration:none">Leads do site</a></div>
      <h1 style="font-size:22px;margin-top:12px">Painel da escola</h1>
      <div class="cgrid" style="margin-top:14px">
        <div class="card" style="padding:12px;text-align:center"><b style="font:800 22px var(--font-d)">${alunos.length}</b><div class="small muted">alunos</div></div>
        <div class="card" style="padding:12px;text-align:center"><b style="font:800 22px var(--font-d)">${enr.length}</b><div class="small muted">matrículas</div></div>
        <div class="card" style="padding:12px;text-align:center"><b style="font:800 22px var(--font-d)">${certs.length}</b><div class="small muted">certificados</div></div>
      </div>
      <label class="field" style="margin-top:14px;background:#fff"><i>${ic("user")}</i><input id="q" placeholder="Buscar aluno ou código família" value="${esc(q)}"></label>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">${list.map(a => { const mine = enr.filter(x => x.user_id === a.id); const nc = certs.filter(x => x.user_id === a.id).length; return `<div class="card" style="padding:12px 14px">
        <div class="row">${avatarCircle(Object.assign({}, a.avatar || {}, { genero: a.genero }), 44, false)}<div style="flex:1;min-width:0"><div style="font-weight:800">${esc(a.nome)}</div><div class="small muted">${esc(a.idade || "")} anos · Nv. ${level(a.xp)} · ${a.xp} XP · <span style="white-space:nowrap">${esc(a.codigo_familia)}</span></div></div><button class="pill" data-cert="${a.id}" style="background:#fff3dc;color:#a2700a">+ Certificado</button></div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${mine.map(m => `<span class="pill" style="background:${C(m.curso).bg};color:${C(m.curso).cor};padding:5px 10px;font-size:12px">${esc(C(m.curso).nome)} ${m.progresso}%</span>`).join("") || '<span class="small muted">Sem cursos</span>'}${nc ? `<span class="pill" style="background:#fff7e0;color:#a2700a;padding:5px 10px;font-size:12px">${nc} certificado${nc > 1 ? "s" : ""}</span>` : ""}</div></div>`; }).join("") || '<div class="card" style="padding:20px;text-align:center">Nenhum aluno encontrado.</div>'}</div></div>`;
    const qi = $("#q"); qi.oninput = () => { q = qi.value.trim().toLowerCase(); const pos = qi.selectionStart; draw(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
    $$("[data-cert]").forEach(b => b.onclick = () => issueCert(alunos.find(a => a.id === b.dataset.cert), row => { certs.push(row); draw(); }));
  };
  draw();
}
function issueCert(aluno, done) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<form class="sheet" role="dialog" aria-modal="true" aria-label="Emitir certificado"><h2 style="font-size:18px">Certificado para ${esc(aluno.nome)}</h2>
    <label class="field"><i>${ic("award")}</i><select id="ct">${COURSES.map(c => `<option>${esc(c.nome)}</option>`).join("")}<option>Academia Digital</option></select></label>
    <label class="field"><i>${ic("tasks")}</i><input id="ch" type="number" min="1" max="2000" value="40" placeholder="Carga horária"></label>
    <button class="btn">Emitir certificado</button><button type="button" class="btn ghost" id="cl">Cancelar</button></form>`;
  document.body.appendChild(m);
  $("#cl", m).onclick = () => m.remove(); m.onclick = ev => { if (ev.target === m) m.remove(); };
  $("form", m).onsubmit = async ev => {
    ev.preventDefault();
    const { data, error } = await sb.from("hs_certificates").insert({ user_id: aluno.id, titulo: $("#ct", m).value, horas: parseInt($("#ch", m).value) || 0 }).select("user_id,titulo").single();
    if (error) { toast("Não foi possível emitir."); return; }
    m.remove(); toast("Certificado emitido"); done(data);
  };
}

/* ---------- Família (pais) ---------- */
async function renderFamilia(code) {
  nav.hidden = true;
  const form = (msg = "") => {
    app.innerHTML = `<div class="login"><a href="#login" class="row" style="text-decoration:none;color:var(--ink);font-weight:800;gap:4px;width:max-content"><span style="width:22px;height:22px">${ic("back", 2.4)}</span>Voltar</a>
      <div class="login-top"><img src="../assets/logo.png" alt="Hall School" style="width:64px;margin:0 auto 10px"><h1 style="font-size:26px">Área dos pais</h1><p class="muted" style="margin:8px 0 0;font-weight:700">Digite o código família que aparece no app do seu filho.</p></div>
      <form class="card login-card" id="f" style="margin-top:22px"><label class="field"><i>${ic("family")}</i><input id="cod" placeholder="HS-0000" maxlength="7" style="text-transform:uppercase;letter-spacing:2px" required></label><p class="err" role="alert">${esc(msg)}</p><button class="btn">Acompanhar</button></form></div>`;
    $("#f").onsubmit = e => { e.preventDefault(); const v = $("#cod").value.trim().toUpperCase(); if (v) location.hash = "familia/" + v; };
  };
  if (!code) return form();
  app.innerHTML = '<div class="spinner"></div>';
  const { data, error } = await sb.rpc("hs_family_view", { p_codigo: code });
  if (error || !data) return form("Código não encontrado. Confira e tente de novo.");
  const d = data;
  app.innerHTML = `<div class="page" style="padding-bottom:40px">
    <div class="between"><a href="#familia" class="small link">Trocar código</a><span class="pill" style="background:#fff;color:var(--muted)">Somente leitura</span></div>
    <div style="text-align:center;margin-top:10px">${avatarCircle(Object.assign({}, d.avatar || {}, { genero: d.genero }), 96)}<h1 style="font-size:21px;margin-top:12px">${esc(d.nome)}</h1><div class="small muted" style="font-weight:700">${esc(d.idade || "")} anos · Unidade ${esc(d.unidade)}</div>
      <div style="display:flex;justify-content:center;gap:8px;margin-top:10px"><span class="pill" style="background:#fff3e0;color:#e07b00">🔥 ${d.sequencia} dias</span><span class="pill" style="background:#e8efff;color:var(--blue)">Nível ${level(d.xp)} · ${d.xp} XP</span></div></div>
    <div class="sec-t"><h2>Cursos</h2></div>
    <div style="display:flex;flex-direction:column;gap:8px">${(d.cursos || []).map(e => { const c = C(e.curso); return `<div class="card row" style="padding:12px 14px"><span class="ic" style="background:${c.bg};color:${c.cor}">${cIcon(c.id)}</span><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14.5px">${esc(c.nome)}</div><div class="small muted">Módulo ${e.modulo} · ${esc(e.aula || "")}</div><div class="prog" style="margin-top:8px"><b style="width:${e.progresso}%"></b></div></div><span class="small" style="font-weight:800;color:var(--dim)">${e.progresso}%</span></div>`; }).join("") || '<p class="muted">Nenhum curso ainda.</p>'}</div>
    <div class="sec-t"><h2>Tarefas concluídas</h2></div>
    <div style="display:flex;flex-direction:column;gap:8px">${(d.tarefas || []).map(t => `<div class="card task done"><span class="chk on"><span style="width:15px;height:15px">${ic("check", 3.5)}</span></span><div class="t" style="flex:1;font-size:14px;font-weight:700">${esc(t.titulo)}</div><span class="xp">+${t.xp} XP</span></div>`).join("") || '<p class="muted">Nenhuma tarefa concluída ainda.</p>'}</div>
    <div class="sec-t"><h2>Certificados</h2></div>
    <div style="display:flex;flex-direction:column;gap:8px">${(d.certificados || []).map(c => `<div class="card row" style="padding:14px;background:linear-gradient(160deg,#fff7e0,#ffe7b0)"><span style="width:28px;height:28px;color:#a2700a">${ic("award")}</span><div><div style="font-weight:800">${esc(c.titulo)}</div><div class="small" style="color:#7a5a12">${c.horas} horas · ${new Date(c.emitido_em + "T12:00").toLocaleDateString("pt-BR")}</div></div></div>`).join("") || '<p class="muted">Nenhum certificado ainda.</p>'}</div>
  </div>`;
}

/* ---------- Boot ---------- */
sb.auth.onAuthStateChange((evt, session) => {
  const had = !!S.session; S.session = session;
  if (evt === "PASSWORD_RECOVERY") { S.recovery = true; location.hash = "nova-senha"; return renderNovaSenha(); }
  if (!session) { S.profile = null; }
  if (evt === "SIGNED_IN" && !had) route();
  if (evt === "SIGNED_OUT") route();
});
window.addEventListener("hashchange", route);
sb.auth.getSession().then(({ data }) => { S.session = data.session; route(); });
if ("serviceWorker" in navigator) { /* PWA install works via manifest; no offline worker needed */ }
})();
</script>
</body>
</html>
